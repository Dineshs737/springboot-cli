linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - whitespace

linters-settings:
  errcheck:
    check-type-assertions: true
  goimports:
    local-prefixes: github.com/springcli/springcli
  misspell:
    locale: US

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
